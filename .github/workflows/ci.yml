name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (real magick.wasm in Chromium)
        run: |
          npx playwright install --with-deps chromium
          node tests/e2e/convert.e2e.mjs
      - name: Lint Firefox build (addons-linter)
        run: npx --yes addons-linter@10 dist/firefox
      - run: node scripts/zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ext-ic-release
          path: release/*.zip
